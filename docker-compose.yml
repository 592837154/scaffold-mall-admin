services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mall-admin-frontend
    depends_on:
      goods-api:
        condition: service_started
    ports:
      - "8000:80"
    restart: unless-stopped

  goods-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: f-goods-api:latest
    container_name: mall-admin-goods-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: mall
      MYSQL_PASSWORD: mall123456
      MYSQL_DATABASE: mall_admin
    ports:
      - "8080:8080"
    restart: unless-stopped

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: mall-admin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: mall_admin
      MYSQL_USER: mall
      MYSQL_PASSWORD: mall123456
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umall -pmall123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql_data:
